apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: task-manager
  labels:
    app: ui
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
        component: frontend
    spec:
      containers:
      - name: ui
        image: tasks-multiserver-ui:0.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        # Note: Vite environment variables are embedded at build time.
        # The configmap values (VITE_API_BASE_URL, VITE_USE_MOCK_DATA) are used
        # as build arguments when building the Docker image, not as runtime env vars.
        # To change API URL, rebuild the image with updated build args.
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
